version: 2

models:
  - name: best_pickup_location_v2
    description: Rank the first five pickup location with more total_trips and the first five with more total_revenue.

    columns:
      - name: pulocationid
        tests:
          - not_null

      - name: total_trips
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: total_revenue
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: trip_rank
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "BETWEEN 1 AND 10"

      - name: revenue_rank
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "BETWEEN 1 AND 10"

      - name: total_score
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "BETWEEN 1 AND 10"

