version: 2

models:
  - name: trips_by_datetime
    description: Aggregation of trips and revenue by time of day.

    columns:
      - name: time_of_day
        tests:
          - not_null
          - accepted_values:
              values: ['Morning', 'Afternoon', 'Evening', 'Night']

      - name: total_trips
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: total_revenue
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
