version: 2

models:
  - name: stg_yellow_tripdata
    description: >
      Cleaned and standardized yellow taxi trip data for the month of August 2025.
    
    tests:
      - dbt_utils.expression_is_true:
          expression: "trip_duration_minutes > 0"
          config:
            severity: error
    
    columns:
      - name: vendorid
        description: Taxi vendor identifier
        tests:
          - not_null
          - accepted_values:
              values: [1, 2]
      
      - name: pickup_datetime
        description: Trip start timestamp
        tests:
          - not_null
      
      - name: dropoff_datetime
        description: Trip end timestamp
        tests:
          - not_null
      
      - name: trip_duration_minutes
        description: Calculated trip duration in minutes
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
          - dbt_utils.expression_is_true:
              expression: "<= 720"
      
      - name: passenger_count
        description: Number of passengers
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "BETWEEN 1 AND 6"
      
      - name: trip_distance
        description: Trip distance in miles
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      
      - name: fare_amount
        description: Base fare amount
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      
      - name: total_amount
        description: Total amount charged
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      
      - name: is_prepaid
        description: Prepaid flag
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      
      - name: distance_category
        description: Distance classification
        tests:
          - not_null
          - accepted_values:
              values: ['short', 'medium', 'long']